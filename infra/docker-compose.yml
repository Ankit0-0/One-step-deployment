# Local stack. Run from the repo root:
#   cp .env.example .env
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#
# Default: postgres, redis, minio (+ bucket bootstrap).
# `--profile apps` also starts api and proxy (run `pnpm db:migrate` first and create
# apps/api/.env + apps/proxy/.env from their .env.example files).
# Builds run in osd/build-worker:local containers: `docker compose ... build build-worker`.

name: osd

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 12

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD}',
        '--appendonly',
        'yes',
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'redis-cli', 'ping']

  # Upstream minio/minio images were withdrawn from Docker Hub; pgsty/* is a maintained community build.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'mc', 'ready', 'local']

  # One-shot: creates the private deployments bucket.
  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
        mc anonymous set none "local/$$STORAGE_BUCKET"
    restart: 'no'

  api:
    profiles: ['apps']
    image: osd/api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    # Local DockerRunner starts build containers through the Docker Engine API.
    # Dev only: access to the Docker socket is root-equivalent on the host.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - '${DOCKER_GID:-0}'
    env_file:
      - path: ../apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  proxy:
    profiles: ['apps']
    image: osd/proxy:local
    build:
      context: ..
      dockerfile: apps/proxy/Dockerfile
    env_file:
      - path: ../apps/proxy/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Image only; the api starts one container per deployment.
  build-worker:
    profiles: ['build']
    image: osd/build-worker:local
    build:
      context: ..
      dockerfile: apps/build-worker/Dockerfile

  web:
    profiles: ['web']
    image: osd/web:local
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # Inlined into the browser bundle; must be URLs the browser can reach.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-localhost:8000}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
