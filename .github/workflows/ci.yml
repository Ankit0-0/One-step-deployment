name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: osd
          POSTGRES_PASSWORD: osd-ci-password
          POSTGRES_DB: osd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osd -d osd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://osd:osd-ci-password@localhost:5432/osd?schema=public
      REDIS_URL: redis://:osd-ci-redis@localhost:6379
      TURBO_TELEMETRY_DISABLED: '1'
      # Public web config inlined at build time.
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_ROOT_DOMAIN: localhost:8000

    steps:
      - uses: actions/checkout@v4

      # Service containers can't take a command, and Redis must require a password.
      - name: Start Redis
        run: docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass osd-ci-redis

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: osd
          POSTGRES_PASSWORD: osd-ci-password
          POSTGRES_DB: osd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osd -d osd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://osd:osd-ci-password@localhost:5432/osd?schema=public
      REDIS_URL: redis://:osd-ci-redis@localhost:6379
      S3_ACCESS_KEY_ID: osd-ci-minio
      S3_SECRET_ACCESS_KEY: osd-ci-minio-password
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_ROOT_DOMAIN: localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Start Redis and MinIO
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass osd-ci-redis
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=osd-ci-minio -e MINIO_ROOT_PASSWORD=osd-ci-minio-password \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @osd/e2e exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Migrate
        run: pnpm db:migrate

      - name: Playwright
        run: pnpm test:e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/.artifacts
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [api, proxy, build-worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
