# Scrapes the api and proxy inside the compose network (`--profile apps --profile monitoring`).
# If METRICS_TOKEN is set on the services, add `authorization: { credentials: <token> }` per job.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:4000']
  - job_name: proxy
    static_configs:
      - targets: ['proxy:8000']
