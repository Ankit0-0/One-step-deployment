# Local stack. Run from the repo root:
#   cp .env.example .env
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#
# Default: postgres, redis, minio (+ bucket bootstrap).
# `--profile apps` also starts api, proxy and web (their Dockerfiles land in Phase 2/3).

name: osd

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 12

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD}',
        '--appendonly',
        'yes',
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'redis-cli', 'ping']

  # Upstream minio/minio images were withdrawn from Docker Hub; pgsty/* is a maintained community build.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'mc', 'ready', 'local']

  # One-shot: creates the private deployments bucket.
  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
        mc anonymous set none "local/$$STORAGE_BUCKET"
    restart: 'no'

  api:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  proxy:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: apps/proxy/Dockerfile
    env_file:
      - path: ../apps/proxy/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    env_file:
      - path: ../apps/web/.env
        required: false
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
